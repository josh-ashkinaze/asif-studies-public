[project]
name = "asif-studies"
version = "1.0.0"
description = "AIM: personalized AI co-writing to reduce psychological distance from policy risks"
requires-python = "==3.13.*"

# Direct imports only, pinned to the versions that produced the reported results.
# The full environment, including every transitive package, is in uv.lock (uv) or
# requirements.txt (pip). Regenerate all three with scripts/freeze_env.sh.
dependencies = [
    # Core analysis
    "numpy==2.1.3",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "statsmodels==0.14.6",
    "pingouin==0.5.5",
    "scikit-learn==1.6.1",
    "semopy==2.3.11",
    "panelbox==1.0.2",
    "sharp-q-values==0.1.1",
    # Plotting
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    # Text and language features
    "pybiber==0.3.1",
    "polars==1.39.3",
    "empath==0.89",
    "nltk==3.9.2",
    "sentence-transformers==5.1.2",
    "torch==2.9.1",
    "bertopic==0.17.3",
    "umap-learn==0.5.9.post2",
    "hdbscan==0.8.40",
    # Data collection and LLM annotation
    "litellm==1.86.2",
    "mediacloud==5.1.0",
    "pymongo==4.17.0",
    "python-dotenv==1.2.2",
    "swifter==1.4.0",
    # Notebook execution
    "ipykernel==7.1.0",
    "nbconvert==7.16.6",
    "papermill==2.7.0",
    "openpyxl==3.1.5",
]

[tool.uv]
# Pin every transitive package to the versions that produced the reported results, so
